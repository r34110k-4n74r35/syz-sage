[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "syz-sage"
version = "0.1.0"
description = "Retrieve, store, and inspect syzbot bug data from the command line"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["syzbot", "syzkaller", "linux", "kernel", "bugs", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Bug Tracking",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.9",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
syz-sage = "syz_sage.cli:main"
ss = "syz_sage.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = ["data", "output", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Preserve long report prose and diagnostic strings in the research workflows.
"scripts/analyze_fixed_bugs.py" = ["E501"]
"scripts/audit_snapshot.py" = ["E501"]
"scripts/build_fixed_bug_report.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/syz_sage"]
exclude = ["^data/", "^output/", "^outputs/"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["syz_sage"]

[tool.coverage.report]
show_missing = true
skip_covered = true
